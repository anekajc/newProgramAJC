worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 20M;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires max;
            log_not_found off;
        }

        # Legacy views build asset URLs as asset('public/js/...') -> /public/js/...
        # The docroot is already .../public, so those 404 here (they only worked when
        # the docroot was the project root). Map /public/* back onto the same folder.
        # ^~ so this wins over the static-asset regex location above.
        location ^~ /public/ {
            alias /var/www/html/public/;
            expires max;
            log_not_found off;

            # Never hand out PHP source through this alias.
            location ~ \.php$ {
                deny all;
            }
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include        fastcgi_params;

            # nginx >= 1.26 (Debian) sets HTTP_HOST to $host, which drops the port.
            # Laravel then builds absolute URLs as http://localhost/... instead of
            # http://localhost:8080/..., breaking form posts and AJAX with CORS errors.
            fastcgi_param  HTTP_HOST      $http_host;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
